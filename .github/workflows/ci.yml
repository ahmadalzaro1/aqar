name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: LAW 1 dependency rule (packages/core purity)
        run: node scripts/check-core-deps.mjs
      - run: pnpm lint
      - run: pnpm typecheck

  unit-property:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Core unit tests
        run: pnpm --filter @aqar/core exec vitest run --exclude '**/*.property.test.ts'
      - name: Core property tests (fast-check)
        run: pnpm --filter @aqar/core exec vitest run property
      - name: UI unit tests
        run: pnpm --filter @aqar/ui test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aqar
          POSTGRES_PASSWORD: aqar_dev
          POSTGRES_DB: aqar
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U aqar" --health-interval 3s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://aqar:***@127.0.0.1:5433/aqar
      REDIS_URL: redis://127.0.0.1:6380
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: DB integration tests (real Postgres, RLS, guards)
        run: pnpm --filter @aqar/db test
      - run: pnpm db:seed

  # e2e (Playwright AR+EN), evals, a11y and screenshot jobs are added in P5/P9
  # when their suites exist — no placeholder green jobs.
