name: CI

# Rules that outrank speed:
#  - the full suite runs before anything reaches main (merge queue, see
#    docs/CI.md); selection only narrows PR feedback
#  - no retries, no widened timeouts, no skipped tests
#  - checks only stay or grow (the `checks` job never exits early)

on:
  push: { branches: [main] }
  pull_request:
  merge_group:

concurrency:
  # a new commit on a PR cancels its old run; main and the merge queue never cancel
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  # one cache epoch for every branch: main populates it, PRs read it
  CACHE_EPOCH: v1

jobs:
  checks:
    name: checks (lint · typecheck · boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          # history and blobs of other commits are not needed to compile
          fetch-depth: 1
          filter: blob:none

      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }

      # pnpm comes from Corepack, which ships with Node. The cache holds the one download
      # per pnpm version; without it Corepack re-fetches on every job.
      - name: pnpm (Corepack, pinned by packageManager)
        env: { COREPACK_ENABLE_DOWNLOAD_PROMPT: '0' }
        run: |
          corepack enable pnpm
          pnpm --version
      - uses: actions/cache@v5
        with:
          path: ~/.cache/node/corepack
          key: corepack-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-${{ env.CACHE_EPOCH }}-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            nm-${{ env.CACHE_EPOCH }}-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: install
        run: pnpm install --frozen-lockfile --prefer-offline

      # PR feedback only: 13 projects on a 4-core runner is 8.7s of the typecheck
      # budget, and the diff decides which of them can have changed. main and the
      # merge queue still check all 13.
      - name: select
        id: select
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci/select-tests.mjs --github-api --github-output >> "$GITHUB_OUTPUT"

      # Runs every check even after one fails, then prints a single table: a PR
      # sees all of its problems in one pass instead of one run per problem.
      - name: all checks (never stops at the first failure)
        env:
          MODE: ${{ steps.select.outputs.mode }}
          PACKAGES: ${{ steps.select.outputs.packages }}
        run: |
          if [ "$MODE" = "affected" ] && [ -n "$PACKAGES" ]; then
            node scripts/ci/checks.mjs --budget 25 --projects "$PACKAGES" --typecheck-budget 5
          else
            node scripts/ci/checks.mjs --budget 45 --typecheck-budget 12
          fi

      - name: budget
        if: always()
        run: node scripts/ci/budget.mjs --job checks --budget 40 --start "$JOB_START"

  build:
    name: build (next)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with: { fetch-depth: 1, filter: blob:none }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }

      # pnpm comes from Corepack, which ships with Node. The cache holds the one download
      # per pnpm version; without it Corepack re-fetches on every job.
      - name: pnpm (Corepack, pinned by packageManager)
        env: { COREPACK_ENABLE_DOWNLOAD_PROMPT: '0' }
        run: |
          corepack enable pnpm
          pnpm --version
      - uses: actions/cache@v5
        with:
          path: ~/.cache/node/corepack
          key: corepack-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-${{ env.CACHE_EPOCH }}-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            nm-${{ env.CACHE_EPOCH }}-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      # reusing the previous .next cache is the difference between a short
      # rebuild and recompiling everything; Next keys the cache by content
      # Turbo's own cache: 2.3MB, and a warm tree builds 43.5s -> 16.7s locally with 8/8
      # tasks replayed. Turbo hashes each task's inputs, so a hit cannot be stale; the
      # coarse key only decides what is worth restoring.
      - name: restore turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/*/package.json', 'apps/*/package.json', 'turbo.json', 'tsconfig.base.json') }}
          restore-keys: turbo-${{ runner.os }}-
      - name: restore next cache
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: next-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/**/*.ts', 'apps/web/**/*.tsx', 'packages/**/*.ts') }}
          restore-keys: |
            next-${{ env.CACHE_EPOCH }}-${{ runner.os }}-

      - name: install
        run: pnpm install --frozen-lockfile --prefer-offline

      - run: pnpm build

      - name: budget
        if: always()
        run: node scripts/ci/budget.mjs --job build --budget 75 --start "$JOB_START"

  test:
    name: tests (unit · property · offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with: { fetch-depth: 1, filter: blob:none }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }

      # pnpm comes from Corepack, which ships with Node. The cache holds the one download
      # per pnpm version; without it Corepack re-fetches on every job.
      - name: pnpm (Corepack, pinned by packageManager)
        env: { COREPACK_ENABLE_DOWNLOAD_PROMPT: '0' }
        run: |
          corepack enable pnpm
          pnpm --version
      - uses: actions/cache@v5
        with:
          path: ~/.cache/node/corepack
          key: corepack-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-${{ env.CACHE_EPOCH }}-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            nm-${{ env.CACHE_EPOCH }}-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: install
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: select (PR feedback only — main and the queue always run everything)
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/select-tests.mjs --github-output >> "$GITHUB_OUTPUT"

      # Every package's typecheck already ran in `checks`; this job is about
      # behaviour. On a PR an unreachable package is skipped, on main it is not.
      - name: core unit
        if: steps.select.outputs.mode == 'all' || contains(steps.select.outputs.packages, 'packages/core')
        run: pnpm --filter @aqar/core exec vitest run --exclude '**/*.property.test.ts'
      - name: core property (fast-check)
        if: steps.select.outputs.mode == 'all' || contains(steps.select.outputs.packages, 'packages/core')
        run: pnpm --filter @aqar/core exec vitest run property
      - name: ui
        if: steps.select.outputs.mode == 'all' || contains(steps.select.outputs.packages, 'packages/ui')
        run: pnpm --filter @aqar/ui test
      - name: web offline
        if: steps.select.outputs.mode == 'all' || contains(steps.select.outputs.packages, 'apps/web')
        run: pnpm --filter @aqar/web test
      - name: agents offline
        if: steps.select.outputs.mode == 'all' || contains(steps.select.outputs.packages, 'packages/agents')
        run: pnpm --filter @aqar/agents test

      # main only: a merge must not be able to drop a test quietly. A PR that removes a
      # test legitimately edits .ci/test-inventory.json, and that edit is reviewed.
      - name: test inventory (a test that stops running is a check that stopped checking)
        if: github.event_name == 'push'
        run: node scripts/ci/test-inventory.mjs --check

      - name: budget
        if: always()
        # 60s, not 45: on push the job also records the test inventory, which re-runs the
        # 6s offline suite to ask "what actually ran?". That is 19s of wall on main only.
        run: node scripts/ci/budget.mjs --job test --budget 60 --start "$JOB_START"

  integration:
    name: tests (postgres · redis · mailpit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg19
        env:
          POSTGRES_USER: aqar
          POSTGRES_PASSWORD: aqar
          POSTGRES_DB: aqar
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U aqar" --health-interval 3s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s
          --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgres://aqar:aqar@127.0.0.1:5433/aqar
      REDIS_URL: redis://127.0.0.1:6380
    steps:
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with: { fetch-depth: 1, filter: blob:none }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }

      # pnpm comes from Corepack, which ships with Node. The cache holds the one download
      # per pnpm version; without it Corepack re-fetches on every job.
      - name: pnpm (Corepack, pinned by packageManager)
        env: { COREPACK_ENABLE_DOWNLOAD_PROMPT: '0' }
        run: |
          corepack enable pnpm
          pnpm --version
      - uses: actions/cache@v5
        with:
          path: ~/.cache/node/corepack
          key: corepack-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-${{ env.CACHE_EPOCH }}-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            nm-${{ env.CACHE_EPOCH }}-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: install
        run: pnpm install --frozen-lockfile --prefer-offline

      # migrations are a shared input: they run on every change, PR or not
      - run: pnpm db:migrate

      - name: select
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/select-tests.mjs --github-output >> "$GITHUB_OUTPUT"

      - name: db integration (real Postgres, RLS, guards)
        if: steps.select.outputs.mode == 'all' || contains(steps.select.outputs.packages, 'packages/db')
        run: pnpm --filter @aqar/db test
      - name: seed
        if: steps.select.outputs.mode == 'all' || contains(steps.select.outputs.packages, 'packages/db')
        run: pnpm db:seed
      - name: worker offline
        if: steps.select.outputs.mode == 'all' || contains(steps.select.outputs.packages, 'apps/worker')
        run: pnpm --filter @aqar/worker test
      - name: channels (live webhooks + Mailpit round-trip)
        if: steps.select.outputs.mode == 'all' || contains(steps.select.outputs.packages, 'apps/channels')
        run: pnpm --filter @aqar/channels test
      - name: evals (deterministic LAW-2 recall gate)
        if: steps.select.outputs.mode == 'all' || contains(steps.select.outputs.packages, 'packages/evals')
        run: pnpm --filter @aqar/evals evals

      - name: budget
        if: always()
        run: node scripts/ci/budget.mjs --job integration --budget 90 --start "$JOB_START"

  # e2e (Playwright AR+EN), a11y and screenshot jobs arrive in P9 when their
  # suites exist — no placeholder green jobs. The live-model evals lane and the
  # worker live E2E need a local model server and stay developer-run.
